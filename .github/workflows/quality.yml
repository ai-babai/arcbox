name: Quality
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    name: Quality / gate
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned quality tools
        run: ./scripts/setup-quality.sh
      - name: Check quality
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        shell: bash
        run: |
          BASE="$PR_BASE"
          if [ -z "$BASE" ]; then BASE="$PUSH_BASE"; fi
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then BASE=$(git rev-parse HEAD^); fi
          ./scripts/quality.sh --base "$BASE"
      - name: Compile Apple Silicon and Intel adapters
        run: |
          swift build --triple arm64-apple-macosx14.0
          swift build --triple x86_64-apple-macosx14.0
      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-reports
          path: .build/quality/
          if-no-files-found: warn
          retention-days: 14
